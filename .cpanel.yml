---
deployment:
  tasks:
    - export DEPLOYPATH=/home1/matiasf6/neuroisbe.examenes-neuro.com
    - /bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='vendor' --exclude='node_modules' --exclude='storage' ./ $DEPLOYPATH
    - cd $DEPLOYPATH && /bin/mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs storage/app/public
    - cd $DEPLOYPATH && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link
    - cd $DEPLOYPATH && /usr/local/bin/php artisan optimize
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force
